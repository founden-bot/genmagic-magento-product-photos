name: magento-install-test
on:
  push:
  workflow_dispatch:
jobs:
  m2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: michielgerritsen/magento-project-community-edition:php84-fpm-magento2.4.8-p5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magento
        options: --health-cmd "mysqladmin ping -proot" --health-interval 10s --health-timeout 5s --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:2.12.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Gm-Ci-Pass-123!"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    steps:
      - uses: actions/checkout@v4
        with:
          path: module
      - name: Install Magento, add the module, compile, use it
        shell: bash
        run: |
          LOG=/tmp/m2.log
          report() { grep -v '^\s*$' "$LOG" | tail -10 | while IFS= read -r line; do echo "::error title=m2::${line:0:250}"; done; grep -v '^\s*$' "$LOG" | tail -30 | head -20 | while IFS= read -r line; do echo "::warning title=m2-before::${line:0:250}"; done; }
          trap 'report; exit 1' ERR
          set -eE
          MODULE="$GITHUB_WORKSPACE/module"
          echo "pwd=$(pwd) php=$(php -v | head -1)" >> "$LOG"
          ROOT=""
          for d in /data /var/www/html /app /magento; do if [ -f "$d/bin/magento" ]; then ROOT="$d"; break; fi; done
          if [ -z "$ROOT" ]; then ROOT=$( (find / -path '*/bin/magento' -not -path '/proc/*' 2>/dev/null || true) | head -1 | xargs dirname | xargs dirname ); fi
          echo "magento root: $ROOT" >> "$LOG"
          cd "$ROOT"
          for i in $(seq 1 30); do curl -s http://opensearch:9200 >/dev/null && break; sleep 5; done
          for i in $(seq 1 60); do php -r 'exit(@mysqli_connect("mysql","root","root","magento") ? 0 : 1);' && break; sleep 3; done
          echo "mysql ready after $i tries" >> "$LOG"
          php bin/magento setup:install --db-host=mysql --db-name=magento --db-user=root --db-password=root \
            --base-url=http://localhost/ --admin-firstname=Ci --admin-lastname=Test --admin-email=ci@example.com \
            --admin-user=admin --admin-password=Admin12345ci --backend-frontname=admin \
            --search-engine=opensearch --opensearch-host=opensearch --opensearch-port=9200 --use-rewrites=1 >> "$LOG" 2>&1
          mkdir -p app/code/GenMagic/ProductPhotos
          cp -R "$MODULE"/. app/code/GenMagic/ProductPhotos/
          rm -rf app/code/GenMagic/ProductPhotos/.git app/code/GenMagic/ProductPhotos/.github
          php bin/magento module:enable GenMagic_ProductPhotos >> "$LOG" 2>&1
          php bin/magento setup:upgrade --keep-generated >> "$LOG" 2>&1
          php bin/magento setup:di:compile >> "$LOG" 2>&1
          php "$MODULE/.github/ci/smoke.php" >> "$LOG" 2>&1
          grep -E "^ok|LIVE MODELS|SMOKE OK" "$LOG" | while IFS= read -r line; do echo "::notice title=smoke::$line"; done
